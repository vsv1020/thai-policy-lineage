name: 每日政策采集

# 替代原先的云端 LLM 会话 Routine:那个方案每天开一个模型会话来跑确定性脚本,
# 贵、不透明,而且失败了不报错(连续 6 周零提交却显示成功)。
#
# 注意:GitHub 的 schedule 触发器只在默认分支(main)上运行。
# 这个文件合并进 main 之前不会自动触发,只能手动 Run workflow。

on:
  schedule:
    - cron: '23 0 * * *'        # UTC 00:23 = 曼谷时间 07:23
  workflow_dispatch:
    inputs:
      backfill:
        description: '回填历史数据:下载回溯期(默认 2 年)内的全部月份,并把翻译上限提到 3000'
        type: boolean
        default: false
      enrich_limit:
        description: '本轮最多翻译多少条(0 = 不翻译;回填时忽略此项)'
        default: '300'

permissions:
  contents: write               # 需要把采集结果提交回仓库

concurrency:
  group: collect
  cancel-in-progress: false     # 不要中途打断一次写入

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # 回填历史数据时要下载几十个月份、翻译上千条
    env:
      TZ: Asia/Bangkok
      ENABLE_SCHEDULER: '0'
      EXPORT_AFTER_COLLECT: '1'
      ENRICH_AFTER_COLLECT: '1'
      ENRICH_MAX_PER_RUN: ${{ github.event.inputs.backfill == 'true' && '3000' || github.event.inputs.enrich_limit || '300' }}
      # 在仓库 Settings → Secrets → Actions 里配置;没配置时翻译步骤自动跳过,采集照常
      # 翻译分类的模型服务商:配了 DEEPSEEK_API_KEY 就用 DeepSeek,否则用 Claude;
      # 想强制指定,在 Variables 里设 ENRICH_PROVIDER=deepseek 或 anthropic
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ENRICH_PROVIDER: ${{ vars.ENRICH_PROVIDER }}
      ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.thaipolicy.com' }}
      # data.go.th 拦截非泰国 IP。在 Secrets 里配置泰国出口:http://user:pass@host:port 或
      # socks5://user:pass@host:port。只用于访问泰国政府数据源;DeepSeek、git push 不走它
      THAI_EGRESS_PROXY: ${{ secrets.THAI_EGRESS_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          # 扫描版公报 PDF 没有文字层,用 OCR 读正文(app/fulltext.py);装不上也不影响采集
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tha > /dev/null || echo "::warning::OCR 工具安装失败,扫描件只能看标题"

      - name: 载入现有事实层
        working-directory: backend
        run: python -m app.ingest --reset

      - name: 采集 → 翻译分类 → 入库 → 导出
        id: collect
        working-directory: backend
        # 先不用 --strict:即使全部源失败,也要把「失败」这一事实提交进仓库,
        # 页面才会诚实显示源状态。是否标红放到最后一步决定。
        run: |
          python -m app.collect --trigger ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }} ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }} | tee ../collect-result.json
          echo "status=$(python -c "import json;print(json.load(open('../collect-result.json'))['status'])")" >> "$GITHUB_OUTPUT"

      - name: 校验
        run: |
          python tools/validate.py
          cd backend && python -m app.ingest --reset > /dev/null && python -m app.export > /dev/null

      - name: 提交采集结果
        run: |
          git config user.name  "policy-collector[bot]"
          git config user.email "policy-collector[bot]@users.noreply.github.com"
          git add data/policies data/site p sitemap.xml robots.txt feed.xml llms.txt llms-full.txt index.html privacy.html
          [ -f ads.txt ] && git add ads.txt || true
          if git diff --cached --quiet; then
            echo "无变化,不提交"
          else
            git commit -m "data: 每日采集 $(date +%F) · ${{ steps.collect.outputs.status }}"
            git push
          fi

      - name: 运行摘要
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              r = json.load(open("collect-result.json"))
          except Exception:
              print("## 采集未产出结果"); raise SystemExit
          print(f"## 采集结果:{r['status']}")
          print(f"- {'回填历史数据' if r.get('backfill') else '日常同步'}(回溯至 {r.get('lookback_since', '—')}):"
                f"新增 {r.get('added', 0)} 条 · 更新 {r.get('updated', 0)} 条")
          print(f"- 数据源:{r['sources_ok']}/{r['sources_total']} 可用 · 出口:{r.get('egress', '直连')}")
          for s in r["sources"]:
              print(f"  - `{s['id']}` {s['status']} — {s['detail'][:160]}")
          e = r.get("enrich") or {}
          print(f"- 翻译分类({e.get('model','—')}):{e.get('status','—')} · 处理 {e.get('processed',0)} · 成功 {e.get('enriched',0)}"
                f" · 读到正文 {e.get('fulltext',0)}(其中 OCR {e.get('ocr',0)}) · 按正文重做旧摘要 {e.get('upgraded',0)}"
                f"(重做前待办 {e.get('upgrade_pending',0)})"
                f" · 判定无关 {e.get('skipped_irrelevant',0)} · 红线跳过 {e.get('skipped_red_line',0)}"
                f" · 仍待处理 {e.get('pending_after', e.get('pending',0))}")
          PY

      # 失败必须响:所有源都失败时让这次运行变红,GitHub 会给仓库所有者发邮件。
      # 结果已经在上一步提交,页面上会显示「采集管道中断」。
      - name: 健康检查
        if: steps.collect.outputs.status == 'failed'
        run: |
          echo "::error::本轮所有数据源均失败。站点仍按最后一次成功的数据展示。检查 Secrets 里的 THAI_EGRESS_PROXY 或数据源是否改版。"
          exit 1
