name: land-use backfill (temporary)
# 临时:在工作分支上跑一次「变更土地用途」专题回填 + 翻译,结果提交回本分支,经 PR 审核后合并。
on:
  push:
    branches: [claude/code-review-loop-autoresearch-pisrof]
    paths: [.github/workflows/backfill-run.yml]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Bangkok
      ENRICH_MAX_PER_RUN: '600'
      SITE_URL: ${{ vars.SITE_URL || 'https://www.thaipolicy.com' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ENRICH_PROVIDER: ${{ vars.ENRICH_PROVIDER }}
      ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
      THAI_EGRESS_PROXY: ${{ secrets.THAI_EGRESS_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -q -r backend/requirements.txt
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tha > /dev/null || true
      - name: 专题回填
        working-directory: backend
        run: |
          python -m app.ingest --reset > /dev/null
          python -m app.collect --backfill-topic land-use | tee ../backfill-result.json
      - name: 翻译
        working-directory: backend
        run: python -m app.enrich --limit 600 | tail -40
      - name: 校验与导出
        run: |
          python tools/validate.py --quiet
          cd backend && python -m app.ingest --reset > /dev/null && python -m app.export > /dev/null
      - name: 提交回工作分支
        run: |
          git config user.name  "policy-collector[bot]"
          git config user.email "policy-collector[bot]@users.noreply.github.com"
          git add -A data/policies data/site p feed sitemap.xml robots.txt feed.xml llms.txt llms-full.txt index.html privacy.html about.html
          [ -d zh-hant ] && git add -A zh-hant || true
          git commit -q -m "data: 专题回填 land-use(土地用途变更与城市规划)" || { echo 无变化; exit 0; }
          git push origin HEAD:${{ github.ref_name }}
