name: SEO / GEO 每日监控

# 每天曼谷时间 03:00:体检线上站点 → 查收录(Search Console / Bing)→ 向 IndexNow、百度、GSC 提交新页面
# → 实测 AI 回答是否引用本站 → 把日报写进 data/seo/ 并提交。
# 日报里的「待处理问题」由随后运行的每日例行会话读取并修改站点(见 docs/seo.md)。
#
# 所有凭据都可选,缺哪个跳过哪一项,日报的「未启用的数据源」会写明。
# 注意:GitHub 的 schedule 只是「尽量准时」,实测本仓库有延迟数小时的情况;schedule 只在默认分支上生效。
# 所以每日修改会话排在 09:45,留足余量。

on:
  schedule:
    - cron: '7 20 * * *'        # UTC 20:07 = 曼谷时间 03:07(避开整点:整点排队最严重)
  workflow_dispatch:
    inputs:
      submit:
        description: '向搜索引擎提交新页面(IndexNow / 百度 / GSC sitemap)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read                 # guard 任务查询今天是否已由服务器触发               # 把日报提交回仓库

concurrency:
  group: seo-monitor
  cancel-in-progress: false

jobs:
  # schedule 是备份:服务器 cron(deploy/dispatch.sh)今天已经准时触发过,就不再重复跑
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/seo.yml/runs?event=workflow_dispatch&per_page=10" \
          | python3 -c "
          import json, sys
          from datetime import datetime, timedelta, timezone
          bkk = timezone(timedelta(hours=7))
          today = datetime.now(bkk).date()
          runs = json.load(sys.stdin).get('workflow_runs', [])
          done = any(datetime.fromisoformat(r['created_at'].replace('Z', '+00:00')).astimezone(bkk).date() == today
                     and r.get('conclusion') in (None, 'success') for r in runs)
          print('skip=' + ('true' if done else 'false'))
          print('今天已由服务器触发过,跳过这次定时运行' if done else '今天还没跑过,继续', file=sys.stderr)
          " >> "$GITHUB_OUTPUT"

  monitor:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Bangkok
      SITE_URL: ${{ vars.SITE_URL || 'https://www.thaipolicy.com' }}
      # 与服务器 .env 相同的 ADMIN_TOKEN:读取服务器记录的爬虫抓取与搜索 / AI 来源访问
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # Google Search Console 服务账号 JSON(整段粘贴);资源不是网域资源时在 Variables 设 GSC_PROPERTY
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt google-auth requests

      - name: 体检 · 收录 · 提交 · GEO 实测
        id: monitor
        working-directory: backend
        run: python -m app.seo_monitor ${{ github.event.inputs.submit == 'false' && '--no-submit' || '' }}

      - name: 提交日报
        if: always()
        run: |
          [ -d data/seo ] || { echo "没有生成日报"; exit 0; }
          git config user.name  "seo-monitor[bot]"
          git config user.email "seo-monitor[bot]@users.noreply.github.com"
          git add data/seo
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "seo: 每日监控日报 $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1

      - name: 运行摘要
        if: always()
        run: '[ -f data/seo/latest.md ] && cat data/seo/latest.md >> "$GITHUB_STEP_SUMMARY" || true'
