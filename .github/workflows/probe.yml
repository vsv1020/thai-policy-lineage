name: probe (temporary)
on:
  push:
    branches: [claude/code-review-loop-autoresearch-pisrof]
    paths: [tools/probe_sources.py, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THAI_EGRESS_PROXY: ${{ secrets.THAI_EGRESS_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r backend/requirements.txt && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tha > /dev/null
      - run: |
          python tools/probe_sources.py
