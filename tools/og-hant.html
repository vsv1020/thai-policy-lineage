<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<!--
  繁体版链接预览图 assets/og-hant.png 的源文件(1200×630)。/zh-hant/ 下的页面分享时显示这张图,
  og:image / twitter:image 由 backend/app/seo.py 的 OG_IMAGE_HANT 指向它。简体版的源文件是 tools/og.html,
  两张图版式相同,只有文字的字形不同(繁体版副标题作「中文整理」)。

  重做:需要 Noto Serif TC(700/900)与 Noto Sans TC(400/500)两套字体,没装的话先取 npm 包
      npm pack @fontsource/noto-serif-tc @fontsource/noto-sans-tc    # 解压后把下面四行 link 指向其中的 css
  再用无头浏览器以 1200×630、设备像素比 1 截图存成 assets/og-hant.png。改完图片记得保持尺寸不变(测试会检查)。
-->
<link rel="stylesheet" href="fonts/noto-serif-tc/700.css">
<link rel="stylesheet" href="fonts/noto-serif-tc/900.css">
<link rel="stylesheet" href="fonts/noto-sans-tc/400.css">
<link rel="stylesheet" href="fonts/noto-sans-tc/500.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f2efe8;color:#171a1c;font-family:"Noto Sans TC",sans-serif;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#b0332a}
.frame{position:absolute;inset:44px 56px 44px 74px;border:1.5px solid #dbd6c9}
.wrap{position:absolute;inset:0;padding:96px 110px 0 130px}
.top{display:flex;align-items:center;gap:26px}
.seal{width:112px;height:112px;background:#b0332a;color:#fff;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:74px;border-radius:8px;line-height:1}
.name{font-family:"Noto Serif TC",serif;font-weight:900;font-size:84px;letter-spacing:2px;line-height:1.1}
.en{font-size:25px;color:#8b877c;letter-spacing:3px;margin-top:8px}
.h{font-family:"Noto Serif TC",serif;font-weight:700;font-size:50px;margin-top:62px;line-height:1.35}
.h b{color:#b0332a;font-weight:700}
.sub{font-size:30px;color:#55524b;margin-top:22px;font-weight:400}
.foot{position:absolute;left:130px;right:110px;bottom:84px;display:flex;justify-content:space-between;align-items:center;font-size:27px;color:#55524b}
.url{font-weight:500;color:#171a1c;letter-spacing:1px}
.tags span{display:inline-block;border:1.5px solid #b0332a;color:#b0332a;padding:3px 16px;margin-left:12px;font-size:23px;border-radius:3px}
</style></head><body>
<div class="bar"></div><div class="frame"></div>
<div class="wrap">
  <div class="top"><div class="seal">脈</div><div><div class="name">政策脈絡 · 泰國</div><div class="en">THAI POLICY LINEAGE</div></div></div>
  <div class="h">泰國<b>皇家公報</b>與<b>內閣決議</b>的中文整理</div>
  <div class="sub">中文摘要 · 正文要點 · 生效日期 · 每條附泰文官方原文</div>
</div>
<div class="foot"><div class="url">www.thaipolicy.com</div><div class="tags"><span>簽證</span><span>稅務</span><span>投資</span><span>勞工</span><span>房產</span><span>海關</span></div></div>
</body></html>
