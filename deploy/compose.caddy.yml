# 叠加在 docker-compose.yml 上:加一个 Caddy 做 HTTPS。
#   docker compose -f docker-compose.yml -f deploy/compose.caddy.yml up -d --build
# host 网络:Caddy 直接占宿主机 80/443,反代到只绑本机的 127.0.0.1:8000
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 里设置 DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
